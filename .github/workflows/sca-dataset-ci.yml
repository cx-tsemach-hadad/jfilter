name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '8'   # verified locally with Corretto 1.8.0_432
          cache: maven
      - name: Exclude timing-dependent FileWatcher integration tests
        run: printf '**/FileWatcherModifyITest.java\n**/FileWatcherOverflowITest.java\n' > jfilter-excludes.txt
      - name: Build and test
        run: mvn -B -ntp clean verify -Dgpg.skip -Dmaven.javadoc.skip=true -Dsurefire.excludesFile=jfilter-excludes.txt
